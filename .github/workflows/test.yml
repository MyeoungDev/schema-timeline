# 단위 테스트와 PostgreSQL 재생 테스트를 돈다. 화면·리포트 비교 테스트가 읽는 out/demo, out/timeline 은 먼저 만든다.
# MySQL·MariaDB·Oracle 재생 테스트와 out/oracle_retail 을 읽는 비교 테스트는 그 이미지가 없으므로 건너뛴다.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull PostgreSQL image
        run: docker pull postgres:16-alpine
      - name: Build sample outputs read by the tests
        run: |
          bash scripts/timeline.sh samples/demo out/demo --lang ko
          cp docs/demo/summary.ko.json out/demo/summary.json
          python3 scripts/render_timeline.py out/demo --out out/demo/timeline.html --lang ko
          bash scripts/timeline.sh samples/flyway out/timeline --lang ko
      - name: Unit and replay tests
        env:
          SCHEMA_TIMELINE_LANG: en
        run: python3 -m unittest discover -s tests -v
      - name: Plugin manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
